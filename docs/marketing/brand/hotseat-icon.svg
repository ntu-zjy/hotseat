<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <title>Hotseat 同桌</title>
  <defs>
    <clipPath id="tile"><rect x="2" y="2" width="116" height="116" rx="27"/></clipPath>
    <clipPath id="h"><path d="M32 33 a9 9 0 0 1 18 0 V51 H70 V33 a9 9 0 0 1 18 0 V87 a9 9 0 0 1 -18 0 V69 H50 V87 a9 9 0 0 1 -18 0Z"/></clipPath>
    <filter id="b10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b16" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <!-- 每个 Agent 一束光：紫、蓝、粉、金，中间是它们汇合的橙 -->
    <g id="lights">
      <circle cx="34" cy="32" r="20" fill="#7B4DFF"/>
      <circle cx="88" cy="30" r="19" fill="#2F8CFF"/>
      <circle cx="32" cy="92" r="19" fill="#FF3D7F"/>
      <circle cx="88" cy="90" r="20" fill="#FFB020"/>
      <circle cx="60" cy="60" r="15" fill="#FF6A2A"/>
    </g>
  </defs>
  <rect x="2" y="2" width="116" height="116" rx="27" fill="#0B0B12"/>
  <g clip-path="url(#tile)"><use href="#lights" filter="url(#b16)" opacity=".9"/></g>
  <g clip-path="url(#h)"><rect width="120" height="120" fill="#0B0B12" opacity=".35"/><use href="#lights" filter="url(#b10)"/><rect width="120" height="120" fill="url(#glass)"/></g>
  <path d="M32 33 a9 9 0 0 1 18 0 V51 H70 V33 a9 9 0 0 1 18 0 V87 a9 9 0 0 1 -18 0 V69 H50 V87 a9 9 0 0 1 -18 0Z" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
  <path d="M36 31 V44" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
  <path d="M74 31 V44" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
  <rect x="2.5" y="2.5" width="115" height="115" rx="26.5" fill="none" stroke="url(#rim)"/>
</svg>
